name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          unzip Brazil2D_Android_Project-1.zip -d android-project
          ls -la android-project
          find android-project -maxdepth 3 -name gradlew -type f -print

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brazil-2D-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
