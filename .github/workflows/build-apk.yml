name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o brazil-2d-android-fixed.zip -d android-project

          echo "===== PROJECT FILES ====="
          find android-project -maxdepth 6 -type f | sort

      - name: Build APK
        run: |
          BUILD_FILE=$(find android-project -name build.gradle -type f | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Build file: $BUILD_FILE"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find android-project -name "*.apk" -type f -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brazil-2D-APK
          path: android-project/**/*.apk
          if-no-files-found: error
