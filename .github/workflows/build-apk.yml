name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -o Brazil2D_UserOnly_BrazilFlagIcon.zip -d android-project
          echo "=== FILES ==="
          find android-project -maxdepth 5 -type f

      - name: Build APK
        run: |
          BUILD_FILE=$(find android-project -name build.gradle -type f | head -n 1)
          echo "Build file: $BUILD_FILE"
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find android-project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brazil-2D-APK
          path: android-project/**/*.apk
